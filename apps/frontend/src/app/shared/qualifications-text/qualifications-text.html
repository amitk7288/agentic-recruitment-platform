<div class="flex items-start justify-between border-b pb-4">
  <div class="">
    <h4 class="mb-1.5 font-bold">{{name()}}</h4>
    <div class="flex flex-col gap-1">
      <p>{{school()}}</p>
      <p>{{yearStart()}} - {{yearEnd()}}</p>
      <ul>
        <li>{{subject()}}: <span class="font-semibold">{{grade()}}</span></li>
      </ul>
    </div>
  </div>
  <button (click)="remove.emit()" class="text-red-500 hover:text-red-700">
    <ng-icon name="featherTrash" />
  </button>
</div>
