<div class="grid grid-cols-2 gap-5">
  <a routerLink="/login">
    <button
      class="border-b p-4 font-bold text-rdblack w-full"
      routerLinkActive="border-b-4 border-b-rdpink"
      [routerLinkActiveOptions]="{exact: true}"
    >
      Sign in
    </button>
  </a>
  <a routerLink="/register">
    <button
      class="border-b p-4 font-bold text-rdblack w-full"
      routerLinkActive="border-b-4 border-b-rdpink"
      [routerLinkActiveOptions]="{exact: true}"
    >
      Register
    </button>
  </a>
</div>
