<div>
  <h2 class="mb-3 text-xl font-bold">Status and availability</h2>
  <form class="flex flex-col gap-3" (ngSubmit)="handleSubmit($event)">
    <div class="flex flex-col gap-1">
      <label class="label-style" for="employment-status"
        >Employment Status</label
      >
      <select
        id="employment-status"
        name="employmentStatus"
        class="input-style"
        [ngModel]="employmentField()"
        (ngModelChange)="employmentField.set($event)"
        required
      >
        <option value="" disabled>Select employment status</option>
        <option value="Employed Full-time">Employed Full-time</option>
        <option value="Employed Part-time">Employed Part-time</option>
        <option value="Unemployed">Unemployed</option>
      </select>
    </div>

    <div class="flex flex-col gap-1">
      <label class="label-style" for="notice-period">Notice Period</label>
      <input
        type="text"
        id="notice-period"
        name="noticePeriod"
        placeholder="e.g. 2 weeks"
        class="input-style"
        [ngModel]="noticeField()"
        (ngModelChange)="noticeField.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="label-style" for="work-eligibility-checkbox"
        >Work Eligibility</label
      >
      <label class="flex items-center">
        <input
          type="checkbox"
          id="work-eligibility-checkbox"
          name="workEligibility"
          class="mr-2"
          [ngModel]="eligibleField()"
          (ngModelChange)="eligibleField.set($event)"
        />
        <span>I am eligible to work in the UK</span>
      </label>
    </div>
    <div class="flex items-center gap-3 justify-end mt-2">
      <app-button (clicked)="closeModal.emit()"> Cancel </app-button>
      <button
        type="submit"
        class="cursor-pointer flex w-fit self-end rounded-md bg-[#cf04a9] px-8 py-2 text-center font-medium text-white hover:bg-[#9f0885]"
      >
        Save
      </button>
    </div>
  </form>
</div>
