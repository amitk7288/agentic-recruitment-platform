<div>
  <h2 class="mb-3 text-xl font-bold">Looking For</h2>
  <form class="flex flex-col gap-3" (ngSubmit)="handleSubmit($event)">
    <div class="flex flex-col gap-1">
      <label class="label-style" for="desiredJobTitle">Desired Job Title</label>
      <input
        type="text"
        id="desiredJobTitle"
        name="desiredJobTitle"
        placeholder="Job title"
        class="input-style"
        [ngModel]="titleField()"
        (ngModelChange)="titleField.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="label-style" for="salary">Salary</label>
      <input
        type="text"
        id="salary"
        name="salary"
        placeholder="e.g. £40,000"
        class="input-style"
        [ngModel]="salaryField()"
        (ngModelChange)="salaryField.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="label-style" for="location">Location</label>
      <input
        type="text"
        id="location"
        name="location"
        placeholder="Location"
        class="input-style"
        [ngModel]="locationField()"
        (ngModelChange)="locationField.set($event)"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label class="label-style" for="job-type">Job Type</label>
      <select
        id="job-type"
        name="jobType"
        class="input-style"
        [ngModel]="jobTypeField()"
        (ngModelChange)="jobTypeField.set($event)"
      >
        <option value="" disabled hidden>Select job type</option>
        <option value="Permanent">Permanent</option>
        <option value="Contract">Contract</option>
        <option value="Full-time">Full-time</option>
        <option value="Part-time">Part-time</option>
      </select>
    </div>
    <div class="flex items-center gap-3 justify-end mt-2">
      <app-button (clicked)="closeModal.emit()"> Cancel </app-button>
      <button
        type="submit"
        class="flex w-fit self-end rounded-md bg-[#cf04a9] px-8 py-2 text-center font-medium text-white hover:bg-[#9f0885]"
      >
        Save
      </button>
    </div>
  </form>
</div>
