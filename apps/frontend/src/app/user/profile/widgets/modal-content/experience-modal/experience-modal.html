<div>
  <h2 class="mb-3 text-xl font-bold">Add Work Experience</h2>
  <form class="flex flex-col gap-3" (ngSubmit)="handleAddExperience($event)">
    <div class="flex flex-col gap-1">
      <label for="role" class="label-style">Role</label>
      <input
        type="text"
        id="role"
        name="role"
        placeholder="e.g. Software Developer"
        [ngModel]="expRole()"
        (ngModelChange)="expRole.set($event)"
        class="input-style"
      />
    </div>

    <div class="flex flex-col gap-1">
      <label for="company" class="label-style">Company</label>
      <input
        type="text"
        id="company"
        name="company"
        placeholder="e.g. Facebook"
        [ngModel]="company()"
        (ngModelChange)="company.set($event)"
        class="input-style"
      />
    </div>

    <div class="flex flex-col gap-4 sm:flex-row">
      <div class="flex flex-col">
        <label for="year-start" class="label-style">Year start</label>
        <input
          type="number"
          id="year-start"
          name="yearStart"
          placeholder="e.g. 2022"
          [ngModel]="yearStart()"
          (ngModelChange)="yearStart.set($event)"
          class="input-style"
        />
      </div>
      <div class="flex flex-col">
        <label for="year-end" class="label-style">Year end</label>
        <input
          type="number"
          id="year-end"
          name="yearEnd"
          placeholder="e.g. 2024"
          [ngModel]="yearEnd()"
          (ngModelChange)="yearEnd.set($event)"
          class="input-style"
        />
      </div>
    </div>
    <div class="flex items-center gap-3 justify-end mt-2">
      <app-button (clicked)="closeModal.emit()"> Cancel </app-button>
      <button
        type="submit"
        [disabled]="!isFormValid()"
        [class]="isFormValid()
              ? 'flex w-fit self-end rounded-md px-8 py-2 text-center font-medium text-white bg-[#cf04a9] hover:bg-[#9f0885]'
              : 'flex w-fit self-end rounded-md px-8 py-2 text-center font-medium text-white cursor-not-allowed bg-gray-400'"
      >
        Add
      </button>
    </div>
  </form>
</div>
