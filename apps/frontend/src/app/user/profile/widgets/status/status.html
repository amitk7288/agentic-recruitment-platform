<app-info-pod #infoPod podTitle="Status and availability" headerLink="Edit">
  <ng-icon podHeaderButton name="featherEdit" />

  <ul class="flex flex-col gap-3">
    <app-info-text title="Employment status" [body]="employmentStatus()" />
    <app-info-text title="Notice period" [body]="noticePeriod()" />
    <app-info-text
      title="Work eligibility"
      [body]="workEligibility() ? 'Eligible to work in the UK' : 'Not eligible to work in the UK'"
    />
  </ul>

  <ng-template #modalContent>
    <app-status-modal (closeModal)="infoPod.isOpen.set(false)" />
  </ng-template>
</app-info-pod>
