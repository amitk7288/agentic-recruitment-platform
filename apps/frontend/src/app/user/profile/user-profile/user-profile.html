<app-job-search />
<div>
  <div class="border-b bg-white p-[15px] lg:hidden">
    <button
      class="flex items-center gap-3 border border-rd-black px-3 py-1.5"
      (click)="isOpen.set(true)"
    >
      <ng-icon name="featherSearch" class="text-2xl text-rd-pink" />
      <p>Developer jobs</p>
    </button>
  </div>
  <div class="border-t bg-[#f8f8f8] px-3 py-5 2xl:px-[50px]">
    <div class="mx-auto max-w-[1280px] md:flex md:gap-6">
      <div
        class="flex basis-[35%] flex-col gap-3 lg:basis-[30%] xl:basis-[30%]"
      >
        <app-about />
        <app-info-pod podTitle="Profile">
          <app-profile-complete />
        </app-info-pod>
      </div>
      <div class="mt-3 flex basis-[80%] flex-col gap-3 md:mt-0">
        <app-cv />
        <app-looking-for />
        <app-status />
        <app-experience />
        <app-qualifications />
      </div>
    </div>
  </div>
</div>
@if (isOpen()) {
<app-modal-dropdown (closed)="isOpen.set(false)">
  <app-mobile-job-search (closeModal)="isOpen.set(false)" />
</app-modal-dropdown>
}
