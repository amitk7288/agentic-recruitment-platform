<div class="md:bg-rd-pink">
  <div
    class="flex h-[240px] w-full flex-col justify-center bg-rd-pink pl-4 md:h-[400px] md:px-10 lg:content-center lg:px-[140px]"
  >
    <div class="mx-auto">
      <div class="flex items-center lg:w-[850px]">
        <div class="basis-[50%] lg:flex lg:justify-center">
          <img
            src="job-hero-title.svg"
            alt="love mondays"
            class="w-[200px] md:w-[370px]"
          />
        </div>
        <div class="flex basis-[50%] justify-end lg:justify-center">
          <img
            src="job-hero-img.png"
            alt="hero img"
            class="w-[160px] md:w-[305px]"
          />
        </div>
      </div>
      <h1
        class="text-xl font-bold text-white md:relative md:bottom-[80px] md:text-4xl lg:bottom-[60px] lg:left-[26px]"
      >
        Find a job you’ll love
      </h1>
    </div>
  </div>
  <div class="mx-auto max-w-[1220px]">
    <div
      class="max-w-[1220px] bg-[#081351] p-4 md:mx-[30px] md:rounded-lg md:px-6 lg:mx-0"
    >
      <form
        [formGroup]="searchForm"
        (ngSubmit)="onSubmit()"
        class="flex flex-col gap-3 md:flex-row md:items-center md:gap-5"
      >
        <div class="md:basis-[40%]">
          <label for="jobTitle" class="mb-1 hidden text-lg text-white md:block">
            What
          </label>
          <input
            type="search"
            id="jobTitle"
            formControlName="jobTitle"
            placeholder='e.g. "agentic ai engineer"'
            class="w-full rounded-md px-4 py-2.5 lg:py-3 bg-white"
            [class.border-2]="searchForm.controls.jobTitle.invalid && searchForm.controls.jobTitle.touched"
            [class.border-red-400]="searchForm.controls.jobTitle.invalid && searchForm.controls.jobTitle.touched"
          />
          <p
            class="text-sm font-semibold text-red-400"
            [class.invisible]="searchForm.controls.jobTitle.valid || searchForm.controls.jobTitle.untouched"
            [class.visible]="searchForm.controls.jobTitle.invalid && searchForm.controls.jobTitle.touched"
          >
            Required field
          </p>
        </div>

        <div class="md:basis-[40%]">
          <label
            for="jobLocation"
            class="mb-1 hidden text-lg text-white md:block"
          >
            Where
          </label>
          <input
            type="search"
            id="jobLocation"
            formControlName="jobLocation"
            placeholder="town or postcode"
            class="w-full rounded-md px-4 py-2.5 lg:py-3 bg-white"
            [class.border-2]="searchForm.controls.jobLocation.invalid && searchForm.controls.jobLocation.touched"
            [class.border-red-400]="searchForm.controls.jobLocation.invalid && searchForm.controls.jobLocation.touched"
          />
          <p
            class="text-sm font-semibold text-red-400"
            [class.invisible]="searchForm.controls.jobLocation.valid || searchForm.controls.jobLocation.untouched"
            [class.visible]="searchForm.controls.jobLocation.invalid && searchForm.controls.jobLocation.touched"
          >
            Required field
          </p>
        </div>

        <button
          type="submit"
          class="cursor-pointer mb-[20px] rounded-md bg-[#cf04a9] px-3 py-2 font-medium text-white hover:bg-[#9f0885] md:mb-[0px] md:mt-1.5 md:flex md:basis-[20%] md:justify-center md:self-center md:px-4 md:py-2.5 lg:py-3"
        >
          Search jobs
        </button>
      </form>
