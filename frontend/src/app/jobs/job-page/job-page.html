<app-job-search />

<div>
  <!-- mobile search bar -->
  <div class="border-b bg-white p-[15px] lg:hidden">
    <button class="flex items-center gap-3 border border-rd-black px-3 py-1.5 cursor-pointer" (click)="isOpen.set(true)">
      <p>Search jobs</p>
    </button>
  </div>

  <div class="border-t bg-[#f8f8f8] px-3 pb-10 pt-5 2xl:px-[50px]">

    <!-- back button -->
    <div class="mx-auto block max-w-[1280px] py-[20px]">
      <button (click)="goBack()" class="flex items-center gap-2 text-xl cursor-pointer">
        <ng-icon name="featherArrowLeftCircle" />
        <p class="text-xl">Back</p>
      </button>
    </div>

    <div class="mx-auto max-w-[1280px] md:flex md:gap-6">
      <div class="basis-[100%]">
        <div class="flex flex-col gap-3">
          <div
            class="flex flex-col gap-6 rounded-lg border border-[#c8c8c8] bg-white p-4 text-[#0f151a] md:w-full md:px-[50px] md:py-[40px]">

            <!-- job info -->
            <div class="flex flex-col gap-6 lg:items-center lg:gap-8 lg:bg-[#f8f8f8] lg:py-7">
              <div class="flex flex-col gap-1 text-sm md:text-base lg:text-center">
                <p class="text-xl font-bold md:text-4xl">{{ jobTitle() }}</p>
                <div class="flex items-center gap-2 md:justify-center">
                  <p>Posted {{ formatDate(datePosted()) }}</p>
                  <span class="font-medium underline">{{ employerName() }}</span>
                </div>
                <div class="flex items-center gap-1 md:justify-center">
                  <ng-icon name="featherZap" class="text-[#FF00CD]" />
                  <p class="font-bold text-[#4d5054]">Easy Apply</p>
                </div>
              </div>

              <div class="flex flex-col gap-6 md:flex-row lg:items-center">
                <!-- meta -->
                <div class="grid basis-[75%] grid-cols-1 gap-1 rounded-md bg-[#f8f8f8] p-4 md:grid-cols-3">
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon name="featherDollarSign" class="text-xl" />
                    <p>
                      @if (minimumSalary() && maximumSalary()) {
                      £{{ minimumSalary() }} - £{{ maximumSalary() }}
                      } @else {
                      Competitive salary
                      }
                    </p>
                  </div>
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon name="featherClock" class="text-xl" />
                    <p>{{ contractType() }}</p>
                  </div>
                  <div class="flex items-center justify-center gap-2">
                    <ng-icon name="featherMapPin" class="text-xl" />
                    <p>{{ locationName() }}</p>
                  </div>
                </div>

                <!-- actions -->
                <div class="flex flex-col justify-center gap-3">
                  <button
                    class="mx-auto block w-[260px] rounded-md bg-[#cf04a9] px-3 py-2 font-medium text-white hover:bg-[#9f0885] cursor-pointer">
                    {{ jobApplied() ? 'Applied!' : 'Apply now' }}
                  </button>
                  <button
                    class="mx-auto flex w-[260px] items-center justify-center gap-1 rounded-md border-2 border-rd-black bg-white px-3 py-2 font-medium hover:bg-rd-black hover:text-white cursor-pointer">
                    @if (jobSaved()) {
                    <ng-icon name="featherHeart" class="text-[#FF00CD]" />
                    <p>Saved!</p>
                    } @else {
                    <ng-icon name="featherHeart" />
                    <p>Save job</p>
                    }
                  </button>
                </div>
              </div>
            </div>

            <!-- job description -->
            <div class="flex flex-col gap-6">
              <div [innerHTML]="sanitizedDescription"></div>
            </div>

          </div>
        </div>
      </div>
    </div>
  </div>
</div>

@if (isOpen()) {
<app-modal-dropdown (closed)="isOpen.set(false)">
  <app-mobile-job-search (closeModal)="isOpen.set(false)" />
</app-modal-dropdown>
}
