<app-job-search />
<div>
  <div class="border-b bg-white p-[15px] lg:hidden">
    <button class="flex items-center gap-3 border border-rdblack px-3 py-1.5" (click)="isOpen.set(true)"
      >
      <ng-icon name="featherSearch" class="text-2xl text-rd-pink" />
      <p>Developer jobs</p>
  </button>
  </div>

  <div class="border-t bg-[#f8f8f8] px-3 py-5 2xl:px-[50px]">
    <div class="mx-auto max-w-[1280px] md:flex md:gap-6">
      <div class="basis-[35%] lg:basis-[30%] xl:basis-[30%]">
        <div class="flex flex-col gap-3">
          <app-about />
          <app-info-pod podTitle="Profile">
            <app-profile-complete />
          </app-info-pod>
        </div>
      </div>
      <div class="basis-[80%]">
        <div id="main" class="flex flex-col gap-3">
          <app-card-list [title]="'Saved Jobs - ' + savedJobs().length">
            <app-saved-jobs />
          </app-card-list>

          <app-card-list [title]="'Jobs Applied to - ' + appliedJobs().length">
            <app-applied-jobs />
          </app-card-list>
        </div>
      </div>
    </div>
  </div>
@if (isOpen()) {
  <app-modal-dropdown>
    <app-mobile-job-search (closeModal)="isOpen.set(false)" />
  </app-modal-dropdown>
  }
