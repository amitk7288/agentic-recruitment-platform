<div #dropdownRef class="relative inline-block text-left">
  <button (click)="toggleDropdown($event)">
    <ng-content select="[trigger]" />
  </button>

  @if (isOpen()) {
  <div class="absolute z-100 mt-2 rounded-sm border border-gray-200 bg-white shadow-lg w-[150px] md:w-full {{pos()}}">
    <ng-content />
  </div>
  }
</div>
