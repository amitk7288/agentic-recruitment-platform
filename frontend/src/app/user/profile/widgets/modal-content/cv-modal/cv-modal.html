<div>
  <h2 class="mb-3 text-xl font-bold">CV</h2>
  <form class="flex flex-col" (ngSubmit)="handleSubmit($event)">

    <div class="flex flex-col gap-1">
      <input type="file" id="upload" (change)="handleFileChange($event)" class="hidden" />
      <label for="upload" class="w-fit cursor-pointer rounded-md border bg-slate-600 px-3 py-2 text-white">
        Choose File
      </label>
      <span class="ml-2">
        {{ fileName() ?? cvValue() ?? 'Upload your CV' }}
      </span>
    </div>
    <div class="flex items-center gap-3 justify-end mt-2">
      <app-button (clicked)="closeModal.emit()">
        Cancel
      </app-button>
      <button type="submit"
        class="flex w-fit items-center gap-1.5 self-end rounded-md bg-[#cf04a9] px-8 py-2 text-center font-medium text-white hover:bg-[#9f0885]">
        <ng-icon name="featherUpload" class="mb-[2px]" />
        <p>Upload</p>
      </button>
    </div>


  </form>
</div>
