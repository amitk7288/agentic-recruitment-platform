<div class="mx-auto max-w-[1220px] py-[50px] px-[23px]">
  <p class="my-5 text-center text-xl font-bold lg:text-3xl">
    Trending Jobs
  </p>
  <div class="flex flex-wrap justify-center gap-3">
    @for (job of trendingJobs; track job.value) {
      <app-button (clicked)="handleClick('job.value')">{{job.label}}</app-button>
    }
  </div>
  <div class="p-[15px] md:hidden">
    <a href="#" class="flex items-center justify-center gap-1 font-medium text-rdlightBlue md:pt-4">
      <p class="hover:underline">See more</p>
      <ng-icon name="featherChevronDown" />
    </a>
  </div>
</div>
