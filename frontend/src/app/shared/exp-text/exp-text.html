<div class="border-b pb-4 flex items-start justify-between">
  <div>
    <h4 class="mb-[6px] font-bold">{{expRole()}}</h4>
    <div class="flex flex-col gap-1">
      <p>{{company()}}</p>
      <p>
        {{from()}} - {{to()}}
      </p>
    </div>
  </div>
  <button (click)="remove.emit()" class="text-red-500 hover:text-red-700">
    <ng-icon name="featherTrash"/>
  </button>
</div>
