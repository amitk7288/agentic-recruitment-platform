<div class="flex flex-col rounded-md border border-[#c8c8c8] bg-white text-rd-black md:w-full">
  <div class="flex items-center justify-between p-4 pb-0">
    <p class="text-[20px] font-bold text-rdblack">{{podTitle()}}</p>
    <button class="flex cursor-pointer items-center gap-2 font-medium" (click)="isOpen.set(true)">
      <p class="hidden text-rdlightBlue s:block">{{headerLink()}}</p>
      <div class="text-rdlightBlue">
        <ng-content select="[podHeaderButton]" />
      </div>
    </button>
  </div>
  <div class="p-4">
    <ng-content />
  </div>
  @if (modalContent()) {
  <app-modal [isOpen]="isOpen()" [content]="modalContent()" (closed)="isOpen.set(false)" />
  }
</div>
