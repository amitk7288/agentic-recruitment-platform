<div class="fixed inset-0 z-[99] bg-gray-900 bg-opacity-80" (click)="closed.emit()" (keydown.enter)="closed.emit()"
  tabindex="0" aria-label="Close modal"></div>
<dialog class="fixed inset-0 z-[100] flex items-center justify-center rounded-md bg-transparent" aria-modal="true">
  <div
    class="relative w-[90vw] rounded-md border border-gray-200 bg-white p-4 shadow-lg sm:h-auto sm:w-[600px]">
    <ng-icon name="featherX" class="absolute right-4 cursor-pointer text-xl text-slate-500 dark:text-drkcol" 
      (click)="closed.emit()" />
    <div class="no-scrollbar max-h-[80vh] overflow-y-auto">
      <ng-content />
    </div>
  </div>
</dialog>
